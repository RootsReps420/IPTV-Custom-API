[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iptv-monitor"
version = "0.1.0"
description = "Health-check IPTV portal URLs and fail over via the EPGenius update_creds API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "dnspython>=2.6",
    "ruamel.yaml>=0.18",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
iptv-monitor = "iptv_monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iptv_monitor = ["static/*"]
