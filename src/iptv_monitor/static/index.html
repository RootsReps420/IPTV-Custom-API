<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=8" />
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <header>
    <div>
      <p class="eyebrow">IPTV · EPGenius failover</p>
      <h1>Portal Monitor</h1>
    </div>
    <div class="meta">
      <div class="stat">
        <span class="label">Live</span>
        <span id="stat-live">—</span>
      </div>
      <div class="stat">
        <span class="label">Standby</span>
        <span id="stat-avail">—</span>
      </div>
      <div class="stat">
        <span class="label">Playlists</span>
        <span id="stat-playlists">—</span>
      </div>
      <div class="stat">
        <span class="label">Last check</span>
        <span id="last-cycle">waiting…</span>
      </div>
      <div class="stat">
        <span class="label">Next check</span>
        <span id="next-check">—</span>
      </div>
      <span id="mode-pill" class="mode-pill" hidden>dry run</span>
    </div>
  </header>
  <div id="alerts" class="alerts" hidden></div>

  <section class="playlists">
    <div class="section-head">
      <h2>Playlists</h2>
      <span id="playlist-count" class="count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Playlist ID</th>
            <th>User</th>
            <th>Current DNS</th>
            <th>Nameserver</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="playlist-body"></tbody>
      </table>
    </div>
  </section>

  <section class="current">
    <div class="section-head">
      <h2>Current DNS</h2>
      <span id="live-count" class="count"></span>
    </div>
    <div id="live-list" class="cards"></div>
  </section>

  <section class="pool">
    <div class="section-head">
      <h2>Available URL pool</h2>
      <span id="avail-count" class="count"></span>
    </div>
    <div id="avail-list" class="cards cards-grid"></div>
  </section>

  <section class="events">
    <div class="section-head">
      <h2>Recent events</h2>
    </div>
    <ol id="event-list" class="event-list"></ol>
  </section>

  <script src="/static/app.js?v=8"></script>
</body>
</html>
