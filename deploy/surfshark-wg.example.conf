# Split-tunnel WireGuard for Magnum /watch only.
# Copy to /etc/wireguard/surfshark.conf and fill in Surfshark values.
# Replace 10.14.0.2 with the IPv4 from Address= (before the slash).
# Do not use a full-tunnel profile that writes the default route on main.

[Interface]
Address = 10.14.0.2/16
PrivateKey = REPLACE_WITH_SURFSHARK_PRIVATE_KEY
Table = 51820
PostUp = ip rule add from 10.14.0.2/32 table 51820
PostDown = ip rule del from 10.14.0.2/32 table 51820

[Peer]
PublicKey = REPLACE_WITH_SURFSHARK_SERVER_PUBLIC_KEY
Endpoint = uk-lon.prod.surfshark.com:51820
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
