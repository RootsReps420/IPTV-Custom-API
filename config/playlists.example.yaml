# Copy to playlists.yaml (gitignored) and fill in real values.
#
# Overview: EPGenius / failover accounts only. Watch uses config/player.yaml instead.
# name + current_dns are enough for URL checks and the dashboard.
# playlist_id / username / password / discord_id are required for live swaps and Discord.
# current_dns is rewritten on the VPS after a successful EPGenius swap — PC copy can be stale.
# manual_from_dns is set by dashboard Switch so Switch back can return to the original host.

playlists:
  - name: account-1
    discord_id: "202010010127958016"
    playlist_id: "your-playlist-id"
    username: "your-username"
    password: "your-password"
    current_dns: "http://your-live-portal.example"
