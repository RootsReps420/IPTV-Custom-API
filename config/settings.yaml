# How often to probe every live and available URL.
# Overview: runtime knobs for the monitor loop and dashboard bind.
# YAML reloads each cycle. Python code changes still need a process restart.
# VPS production must keep dashboard_host: 127.0.0.1 (Caddy proxies). Local may use 0.0.0.0.
check_interval_seconds: 10

# Live URL must fail this many cycles in a row before EPGenius is called.
consecutive_failures_to_swap: 3

# Prefer standbys that have been healthy this many cycles (falls back to any currently healthy).
min_consecutive_successes_for_swap: 2

# Dead = DNS fail OR TCP fail. HTTP GET / is too noisy on Xtream portals, leave it off.
dns_check_enabled: true
tcp_check_enabled: true
http_check_enabled: false

# Short HTTP MPEG-TS pull (what players use). Failures count toward failover.
stream_check_enabled: true

dns_timeout_seconds: 5
tcp_timeout_seconds: 5
http_timeout_seconds: 10
stream_timeout_seconds: 10

# Many IPTV portals use invalid TLS certs; only used if HTTP or stream checks run.
allow_insecure_tls: true

# 127.0.0.1 = this PC only. 0.0.0.0 = also reachable on your LAN.
dashboard_host: 0.0.0.0
dashboard_port: 8787

# Discord status channel (DISCORD_WEBHOOK_STATUS): edit one message, no extra posts.
# Refresh the "checked … ago" line at least this often when nothing else changed.
# Down/up, fail counts, and DNS swaps still edit immediately. 0 = every check cycle.
discord_status_min_interval_seconds: 60

# Standby cards show "Frequent failure" after this many separate downs in the window.
frequent_failure_down_events: 3
frequent_failure_window_hours: 24

# History tab: how long to keep per-URL down events.
history_retention_days: 90

# Watch: live/VOD/series lists + now/next EPG into state/. 14400 = 4 hours.
watch_sync_seconds: 14400
